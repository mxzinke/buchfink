version: '3'

vars:
  APP_NAME: "buchfink"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  test:
    summary: Runs the Go test suite
    # Not `go test ./...`: main.go embeds frontend/dist, which only exists after a
    # frontend build, and internal/wailsbridge pulls in Wails v3 with its GTK and
    # WebKit headers. Neither package has tests. Listing the packages that do
    # keeps the suite runnable from a plain checkout.
    cmds:
      - go test ./internal/accounting/... ./internal/bank/... ./internal/domain/...
        ./internal/einvoice/... ./internal/invoice/... ./internal/receiptstore/...
        ./internal/repository/... ./internal/security/... ./internal/service/...
        ./internal/timestamp/... {{.CLI_ARGS}}

  vet:
    summary: Runs go vet over the same packages as the test suite
    cmds:
      - go vet ./internal/accounting/... ./internal/bank/... ./internal/domain/...
        ./internal/einvoice/... ./internal/invoice/... ./internal/receiptstore/...
        ./internal/repository/... ./internal/security/... ./internal/service/...
        ./internal/timestamp/...

  check:design:
    summary: Checks the frontend against the token layer of docs/design-konzept.md
    cmds:
      - python3 scripts/check_design_tokens.py

  check:
    summary: Formatting, vet and tests — what to run before committing
    cmds:
      - gofmt -l internal main.go
      - task: vet
      - task: test
      - task: check:design

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  notices:
    summary: Regenerates THIRD-PARTY-NOTICES.md from the actual dependencies
    cmds:
      - go mod download
      - "{{.PACKAGE_MANAGER}} --prefix frontend install"
      - python3 scripts/gen_third_party_notices.py
