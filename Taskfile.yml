version: '3'

vars:
  APP_NAME: "buchfink"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Programmfassung für -ldflags (internal/buildinfo.Version, main.version der
  # Brücke). Sie steht in jedem Export, jeder Sicherung und jeder Voranmeldung.
  # Auf einem sauberen Stand mit Tag vX.Y.Z ist sie X.Y.Z, sonst „dev“. Der
  # Release-Workflow setzt sie ausdrücklich: task linux:build VERSION=0.3.0.
  VERSION:
    sh: v=$(git describe --tags --exact-match --match 'v[0-9]*.[0-9]*.[0-9]*' --dirty 2>/dev/null) || v=; case "$v" in v*-dirty|"") echo dev ;; *) echo "${v#v}" ;; esac

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  test:
    summary: Runs the Go test suite
    # Not `go test ./...`: main.go embeds frontend/dist, which only exists after a
    # frontend build. Every package under internal/ and cmd/ runs, so a new
    # package cannot drop out of the suite.
    #
    # internal/wailsbridge is left out: it pulls in Wails v3 with its GTK and
    # WebKit headers, and `task test` must stay runnable on a machine that has
    # none. Those tests live in `test:bridge` and run wherever the app itself
    # can be built.
    vars:
      PACKAGES:
        sh: go list ./internal/... ./cmd/...
    cmds:
      - go test {{without (splitLines .PACKAGES) "github.com/buchfink/buchfink/internal/wailsbridge" | join " "}} {{.CLI_ARGS}}

  vet:
    summary: Runs go vet over the same packages as the test suite
    vars:
      PACKAGES:
        sh: go list ./internal/... ./cmd/...
    cmds:
      - go vet {{without (splitLines .PACKAGES) "github.com/buchfink/buchfink/internal/wailsbridge" | join " "}}

  test:bridge:
    summary: Runs vet and the tests of the Wails bridge (needs the GTK/WebKit headers)
    # A source-level test holds every bridge method to a classification of
    # "reads" or "writes" — the read-only audit mode in internal/core only sees
    # what the bridge routes through Tenant.Write. A test that never runs holds
    # nothing — so run this task wherever the app can be built, which is
    # anywhere `task build` works.
    cmds:
      - go vet ./internal/wailsbridge/...
      - go test ./internal/wailsbridge/... {{.CLI_ARGS}}

  test:ebilanz-xsd:
    summary: Validates the E-Bilanz instances against the official XBRL schemas
    # The taxonomy schemas are not in the repository (only the extract the
    # instances are built from), and validating against the full de-gaap-ci
    # schema takes long. This task fails instead of skipping when the schemas
    # are missing. Set EBILANZ_XSD_6_9 and EBILANZ_XSD_6_10 to wrapper schemas
    # over a local copy of the taxonomy packages (www.esteuer.de, Taxonomien;
    # see internal/ebilanz/xsd_test.go), optionally EBILANZ_XSD_VALIDATOR.
    env:
      EBILANZ_XSD_REQUIRED: "1"
    cmds:
      - go test -count=1 -run TestInstancesAreSchemaValid ./internal/ebilanz/ {{.CLI_ARGS}}

  check:design:
    summary: Checks the frontend against the token layer of docs/gestaltung/grundlagen.md
    cmds:
      - python3 scripts/check_design_tokens.py

  check:bridge:
    summary: Checks that frontend/src/services/bridge.ts matches the Go bridge
    cmds:
      - python3 scripts/check_bridge_bindings.py

  check:text:
    summary: Checks that the Arbeitsansichten name no Norm outside the Erklärstufen
    # Architektur 6.4: ein Titel sagt, was zu tun ist, und ein Paragraph sagt,
    # warum — der gehört hinter das Erklärzeichen. Die Heuristik ist grob, weil
    # eine genaue Prüfung den Text verstehen müsste; sie hält die Norm dort,
    # wo sie erklärt wird.
    cmds:
      - python3 scripts/check_ui_text.py
      - node scripts/check_help.mjs

  check:steps:
    summary: Checks that every Abschlussbaustein has a target in the geführter Weg
    # Architektur 6.3: jeder Schritt öffnet seine Arbeit. Die Schlüssel stehen im
    # Backend, die Ziele in der Oberfläche — und ein neuer Baustein bringt sein
    # Ziel nicht von selbst mit.
    cmds:
      - python3 scripts/check_closing_steps.py

  check:clicks:
    summary: Walks the Prüfszenario from the Bilanz to the Beleg and counts the clicks
    # GOB-02, Entscheidung 8 der Welle 7: „Keine Buchung ohne Beleg" ist erst
    # dann eine Aussage über die Bedienung, wenn der Weg vom Abschluss zurück
    # zum Papier begehbar ist. Der Lauf braucht einen Chromium für Playwright
    # und steht deshalb neben `check` und nicht darin.
    cmds:
      - node scripts/site-screenshots/four-clicks.mjs

  check:
    summary: Formatting, vet and tests — what to run before committing
    # `test:bridge` is deliberately not part of this: it needs the GTK/WebKit
    # headers, and `task check` has to work on a plain checkout. On a machine
    # that can build the app, run `task test:bridge` alongside it.
    cmds:
      - gofmt -l internal main.go
      - task: vet
      - task: test
      - task: check:design
      - task: check:bridge
      - task: check:text
      - task: check:steps

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  build:mcp:
    summary: Builds the stdio bridge cmd/buchfink-mcp for Claude Desktop
    # Ohne CGO und ohne Wails: GOOS und GOARCH aus der Umgebung wählen das Ziel,
    # gebaut wird von jedem Rechner aus.
    cmds:
      - go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version={{.VERSION}}" -o "{{.OUTPUT}}" ./cmd/buchfink-mcp
    vars:
      OUTPUT: '{{.OUTPUT | default "bin/buchfink-mcp"}}'
    env:
      CGO_ENABLED: 0

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  notices:
    summary: Regenerates THIRD-PARTY-NOTICES.md from the actual dependencies
    cmds:
      - go mod download
      - "{{.PACKAGE_MANAGER}} --prefix frontend install"
      - python3 scripts/gen_third_party_notices.py

  pages:preview:
    summary: Serves website/ locally at http://127.0.0.1:8000
    cmds:
      - python3 -m http.server 8000 --directory website

  pages:publish:
    summary: Publishes website/ to the gh-pages branch
    # Schiebt den Inhalt von website/ als Wurzel des Zweigs gh-pages. In den
    # Repository-Einstellungen steht Pages auf „Deploy from a branch", Zweig
    # gh-pages, Ordner „/ (root)" — die Veröffentlichung läuft damit von Hand
    # und ohne CI. Nach jeder Änderung an der Seite ausführen.
    #
    # Weist der Push zurück, weil gh-pages auseinandergelaufen ist, hilft die
    # ausdrückliche Form:
    #   git push origin $(git subtree split --prefix website HEAD):gh-pages --force
    cmds:
      - git subtree push --prefix website origin gh-pages
