name: E-Bilanz-Schemata

# Prüft die E-Bilanz-Instanzen gegen die amtlichen Schemata 6.9 und 6.10. Die
# Pakete kommen von xbrl.de und xbrl.org. Damit ein Ausfall dort nicht jeden
# Pull Request rot färbt, läuft die Prüfung nur bei Änderungen an den Paketen,
# aus denen die Instanzen entstehen, wöchentlich auf master und vor jedem
# Release. Der wöchentliche Lauf hält den Cache der Pakete warm.

on:
  push:
    branches: [master]
    paths:
      - internal/ebilanz/**
      - internal/accounting/**
      - internal/domain/**
      - internal/calendar/**
      - scripts/ebilanz_schemas.sh
      - scripts/XsdValidate.java
      - Taskfile.yml
      - go.mod
      - .github/workflows/ebilanz-xsd.yml
  pull_request:
    paths:
      - internal/ebilanz/**
      - internal/accounting/**
      - internal/domain/**
      - internal/calendar/**
      - scripts/ebilanz_schemas.sh
      - scripts/XsdValidate.java
      - Taskfile.yml
      - go.mod
      - .github/workflows/ebilanz-xsd.yml
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ebilanz-xsd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TASK_VERSION: v3.40.1

jobs:
  ebilanz-xsd:
    name: E-Bilanz gegen die amtlichen Schemata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Task installieren
        run: go install "github.com/go-task/task/v3/cmd/task@$TASK_VERSION"

      # Die Prüfsummen stehen im Skript; ändert es sich, lädt der Job neu.
      - name: Taxonomiepakete aus dem Cache
        uses: actions/cache@v6
        with:
          path: .cache/ebilanz-xsd/download
          key: ebilanz-xsd-${{ hashFiles('scripts/ebilanz_schemas.sh') }}

      - name: Schemaprüfung 6.9 und 6.10
        run: task test:ebilanz-xsd
