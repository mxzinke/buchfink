name: CI

# Der Release-Workflow ruft diese Prüfungen vor dem Veröffentlichen auf.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Dieselbe Fassung, die wails3 v3.0.0-beta.9 für `wails3 task` mitbringt.
  TASK_VERSION: v3.40.1

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Wails baut unter Linux gegen GTK 3 und WebKit2GTK 4.1 (Build-Tag gtk3).
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Task installieren
        run: go install "github.com/go-task/task/v3/cmd/task@$TASK_VERSION"

      # main.go bettet frontend/dist ein. Den echten Frontend-Build prüft der
      # Job „Frontend und Prüfskripte“.
      - name: Platzhalter für frontend/dist
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html>' > frontend/dist/index.html

      - name: go mod tidy ändert nichts
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "Nicht mit gofmt formatiert:"
            echo "$unformatted"
            exit 1
          fi

      - name: Bauen
        run: go build -tags gtk3 ./...

      - name: Brücke ohne CGO bauen
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/buchfink-mcp" ./cmd/buchfink-mcp

      - name: go vet
        run: go vet -tags gtk3 ./...

      # internal/... und cmd/... ohne internal/wailsbridge (siehe Taskfile.yml).
      - name: Tests
        run: task test

      - name: Tests der Wails-Bridge
        run: go test -tags gtk3 ./internal/wailsbridge/...

  frontend:
    name: Frontend und Prüfskripte
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Bauen
        run: npm run build

      - name: Tests
        run: npm test

      # check_help.mjs liest TypeScript aus frontend/node_modules.
      - name: Prüfskripte
        working-directory: .
        run: |
          status=0
          for script in scripts/check_*.py; do
            echo "::group::$script"
            python3 "$script" || status=1
            echo "::endgroup::"
          done
          node scripts/check_help.mjs || status=1
          python3 scripts/version.py check || status=1
          exit $status

      # check_skills.py läuft oben mit. package_skills.py prüft zusätzlich die
      # Symlinks des Plugins und packt wie der Release-Workflow.
      - name: Skills und Plugin
        working-directory: .
        run: python3 -I scripts/package_skills.py --out "$RUNNER_TEMP/skills"
