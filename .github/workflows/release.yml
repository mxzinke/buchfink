name: Release

# Ein Tag vX.Y.Z baut die App für Linux, Windows und macOS, die Brücke
# buchfink-mcp, die Erweiterung für Claude Desktop und die Skill-Pakete und
# veröffentlicht sie als GitHub-Release; ein Tag mit Zusatz wie -rc.1 als
# Vorabversion. Veröffentlicht wird nur, wenn die Prüfungen aus ci.yml und
# ebilanz-xsd.yml grün sind und jede Datei vorliegt, auf die Anleitungen und
# Webseite unter releases/latest/download/ verweisen. Signiert wird nichts,
# die macOS-App bekommt nur die Ad-hoc-Signatur aus build/darwin/Taskfile.yml.
#
# Vor dem Tag: python3 scripts/version.py set X.Y.Z, Eintrag
# „## vX.Y.Z — JJJJ-MM-TT“ in internal/changelog/CHANGELOG.md. Der Job
# „Fassung prüfen“ bricht sonst ab. Der Eintrag ist der Text des Release.
#
# Die Dateinamen enthalten keine Fassung, damit Links auf
# releases/latest/download/<datei> stabil bleiben.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  TASK_VERSION: v3.40.1
  WAILS_VERSION: v3.0.0-beta.9
  MCPB_VERSION: 2.1.2

jobs:
  ci:
    name: Prüfungen
    uses: ./.github/workflows/ci.yml

  ebilanz-xsd:
    name: E-Bilanz-Schemata
    uses: ./.github/workflows/ebilanz-xsd.yml

  version:
    name: Fassung prüfen
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag, Paketdateien und Änderungshistorie
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/version.py check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Text des Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/version.py notes "$VERSION" > notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  app:
    name: App ${{ matrix.name }}
    needs: version
    strategy:
      matrix:
        include:
          # Linux braucht CGO für GTK 3 und WebKit2GTK 4.1.
          - name: Linux
            goos: linux
            runner: ubuntu-24.04
          # Windows kommt ohne CGO aus und wird unter Linux gebaut.
          - name: Windows
            goos: windows
            runner: ubuntu-24.04
          # macOS braucht CGO und einen Mac; arm64 und amd64 in einem Binary.
          - name: macOS
            goos: darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Auch für Windows: wails3 selbst bindet unter Linux GTK ein.
      - name: Systempakete
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Task und wails3 installieren
        run: |
          go install "github.com/go-task/task/v3/cmd/task@$TASK_VERSION"
          if [ "$RUNNER_OS" = Linux ]; then
            go install -tags gtk3 "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"
          else
            go install "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"
          fi

      - name: Frontend-Abhängigkeiten
        run: npm ci
        working-directory: frontend

      - name: Bauen für Linux
        if: matrix.goos == 'linux'
        run: |
          task linux:build VERSION="$VERSION" EXTRA_TAGS=gtk3
          mkdir -p dist
          tar -C bin -czf dist/buchfink-linux-amd64.tar.gz buchfink

      - name: Bauen für Windows
        if: matrix.goos == 'windows'
        run: |
          task windows:build VERSION="$VERSION" ARCH=amd64
          mkdir -p dist
          cp bin/buchfink.exe dist/buchfink-windows-amd64.exe

      # package:universal legt bin/buchfink.app an und signiert ad hoc.
      - name: Bauen für macOS
        if: matrix.goos == 'darwin'
        run: |
          task darwin:package:universal VERSION="$VERSION"
          mkdir -p dist
          ditto -c -k --keepParent bin/buchfink.app dist/buchfink-darwin-universal.zip

      - uses: actions/upload-artifact@v7
        with:
          name: asset-app-${{ matrix.goos }}
          path: dist/
          if-no-files-found: error

  mcp:
    name: Brücke und Claude-Desktop-Erweiterung
    needs: version
    # lipo gibt es nur unter macOS. Die übrigen Ziele baut Go ohne CGO von hier.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Task installieren
        run: go install "github.com/go-task/task/v3/cmd/task@$TASK_VERSION"

      - name: Brücke bauen
        run: |
          mkdir -p dist
          build() { GOOS=$1 GOARCH=$2 task build:mcp VERSION="$VERSION" OUTPUT="$3"; }
          build darwin arm64 "$RUNNER_TEMP/buchfink-mcp-darwin-arm64"
          build darwin amd64 "$RUNNER_TEMP/buchfink-mcp-darwin-amd64"
          lipo -create -output dist/buchfink-mcp-darwin-universal \
            "$RUNNER_TEMP/buchfink-mcp-darwin-arm64" "$RUNNER_TEMP/buchfink-mcp-darwin-amd64"
          build windows amd64 dist/buchfink-mcp-windows-amd64.exe
          build linux amd64 dist/buchfink-mcp-linux-amd64
          build linux arm64 dist/buchfink-mcp-linux-arm64

      # Inhalt wie in packaging/claude-desktop/README.md beschrieben.
      - name: Erweiterung packen
        run: |
          pkg="$RUNNER_TEMP/claude-desktop"
          cp -R packaging/claude-desktop "$pkg"
          mkdir -p "$pkg/server"
          cp dist/buchfink-mcp-darwin-universal "$pkg/server/buchfink-mcp"
          cp dist/buchfink-mcp-windows-amd64.exe "$pkg/server/buchfink-mcp.exe"
          cp build/appicon.png "$pkg/icon.png"
          cd "$pkg"
          npx --yes "@anthropic-ai/mcpb@$MCPB_VERSION" validate manifest.json
          npx --yes "@anthropic-ai/mcpb@$MCPB_VERSION" pack . "$GITHUB_WORKSPACE/dist/buchfink.mcpb"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-mcp
          path: dist/
          if-no-files-found: error

  skills:
    name: Skill-Pakete
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Die Anleitungen unter docs/nutzung/ki-agenten verlinken die Pakete.
      - name: Packen
        run: |
          mkdir -p dist
          if [ ! -d skills ] || [ ! -f scripts/package_skills.py ]; then
            echo "::error::skills/ oder scripts/package_skills.py fehlt."
            exit 1
          fi
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            python3 scripts/package_skills.py --out "$RUNNER_TEMP/skills"
          cp "$RUNNER_TEMP"/skills/*.zip dist/

      - uses: actions/upload-artifact@v7
        with:
          name: asset-skills
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub-Release
    needs: [ci, ebilanz-xsd, version, app, mcp, skills]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: notes

      - name: Prüfsummen
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Verlinkte Dateien vorhanden
        run: |
          status=0
          for file in $(git grep -hoE 'releases/latest/download/[A-Za-z0-9._-]+' -- '*.md' '*.html' | sed -e 's|.*/||' -e 's/\.*$//' | sort -u); do
            if [ ! -f "dist/$file" ]; then
              echo "::error::Verlinkt, aber nicht im Release: $file"
              status=1
            fi
          done
          exit $status

      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Buchfink $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
